[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
nodaemon=true
user=root

[program:rsyslog]
command=/usr/sbin/rsyslogd -n -iNONE
numprocs=1
autostart=true
autorestart=true

[program:apache2]
; remove a pid file left behind by an unclean stop (docker restart keeps the container fs and pids get
; reused), otherwise apache sees a live foreign process with that pid and refuses with "already running"
command=/bin/sh -c 'rm -f /var/run/apache2/apache2.pid && exec /usr/sbin/apache2ctl -D FOREGROUND'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
umask=002

[program:php-fpm]
command=/usr/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
umask=002

[program:cron]
command=/usr/local/bin/cron-foreground
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:docker-php-init]
command=/docker-php-init
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
